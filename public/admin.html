<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — Dealerama</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#fff; --surface-2:#f9fafb; --line:#e4e7ec; --line-strong:#d0d5dd;
    --ink:#101828; --ink-2:#344054; --muted:#667085; --brand:#047857; --brand-ink:#fff;
    --ok:#067647; --warn:#b54708; --bad:#b42318; --accent:#10b981;
    --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
    --focus:0 0 0 3px rgba(16,185,129,.25);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(245,246,248,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;gap:10px;height:62px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
  .spacer{flex:1}
  .btn{font:inherit;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 13px;cursor:pointer;text-decoration:none;line-height:1.2;font-weight:600;transition:background .15s,border-color .15s,box-shadow .15s}
  .btn:hover{background:var(--surface-2);border-color:#b9c0cc}
  .btn:focus-visible{outline:none;box-shadow:var(--focus)}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .btn-primary:hover{background:#065f46;border-color:#065f46}
  .btn-danger{color:var(--bad);border-color:#fda29b}
  .btn-danger:hover{background:#fef3f2}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-ghost:hover{background:#eceff3}
  .icon{font-size:15px;line-height:1}

  /* ---------- notices ---------- */
  #msg{min-height:0}
  .toast{margin-top:14px;border-radius:var(--r-sm);padding:10px 14px;font-weight:600;font-size:13px;border:1px solid;display:none}
  .toast.show{display:block}
  .toast.ok{background:#ecfdf3;border-color:#a6f4c5;color:var(--ok)}
  .toast.bad{background:#fef3f2;border-color:#fecdca;color:var(--bad)}
  .toast.warn{background:#fffaeb;border-color:#fedf89;color:var(--warn)}
  .banner{display:flex;gap:10px;align-items:flex-start;background:#fffaeb;border:1px solid #fedf89;color:#7a2e0e;border-radius:var(--r-sm);padding:12px 14px;margin-top:14px;font-size:13px;line-height:1.45}
  .banner b{font-weight:800}

  /* ---------- login ---------- */
  .login{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px;max-width:400px;margin:56px auto}
  .login p{color:var(--muted);font-size:13px;margin:8px 0 18px}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;margin:18px 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:2px}
  .tabs button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;border-radius:6px 6px 0 0}
  .tabs button:hover{color:var(--ink);background:#eceff3}
  .tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
  .tabs .count{display:inline-block;margin-left:6px;background:#eceff3;color:var(--ink-2);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700}

  /* ---------- kpis ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
  .kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:3px}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .search{position:relative;flex:1;min-width:200px;max-width:340px}
  .search input{padding-left:32px}
  .search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip:hover{border-color:#b9c0cc}

  /* ---------- form primitives ---------- */
  label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
  label > .lbl{display:block;margin-bottom:5px}
  input,select,textarea{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;transition:border-color .15s,box-shadow .15s}
  input:hover,select:hover,textarea:hover{border-color:#b9c0cc}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus)}
  input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:#f04438;box-shadow:0 0 0 3px rgba(240,68,56,.12)}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);padding:0}
  input[type=color]{padding:3px;height:36px;cursor:pointer}
  textarea{resize:vertical;min-height:80px}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:5px}
  .err{font-size:11.5px;color:var(--bad);font-weight:700;margin-top:4px;display:none}
  .err.show{display:block}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
  @media(max-width:900px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:620px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);height:36px;text-transform:none;letter-spacing:0}

  /* ---------- product rows ---------- */
  .prow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .prow[data-dirty]{border-color:#f79009;box-shadow:0 0 0 3px rgba(247,144,9,.12)}
  .prow.open{border-color:#98a2b3}
  .prow-main{display:grid;grid-template-columns:56px minmax(0,1fr) auto 20px;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
  .prow-main:hover{background:var(--surface-2)}
  .prow-main:focus-visible{outline:none;box-shadow:inset var(--focus)}
  .thumb{width:56px;height:56px;object-fit:contain;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
  .prow-title{font-weight:700;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
  .prow-meta .sep{color:var(--line-strong)}
  .chev{color:var(--muted);font-size:13px;transition:transform .18s}
  .prow.open .chev{transform:rotate(180deg)}
  .badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:#eceff3;color:var(--ink-2)}
  .badge.live{background:#ecfdf3;color:var(--ok)}
  .badge.draft{background:#fffaeb;color:var(--warn)}
  .badge.upcoming{background:#eff8ff;color:#175cd3}
  .badge.archived{background:#f2f4f7;color:var(--muted)}
  .dirty-dot{display:none;width:8px;height:8px;border-radius:50%;background:#f79009}
  .prow[data-dirty] .dirty-dot{display:inline-block}

  /* ---------- editor ---------- */
  .pedit{border-top:1px solid var(--line);background:var(--surface)}
  .sect{padding:18px 16px;border-bottom:1px solid var(--line)}
  .sect:last-child{border-bottom:0}
  .sect-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .sect-head h3{text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:11.5px}
  .sect-head .spacer{flex:1}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .imgcard{position:relative;width:84px}
  .imgcard img{width:84px;height:84px;object-fit:contain;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
  .imgcard .cover{position:absolute;top:-6px;left:-6px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:1px 6px;text-transform:uppercase}
  .imgcard .ops{display:flex;justify-content:center;gap:2px;margin-top:3px}
  .imgcard .ops button{border:1px solid var(--line);background:var(--surface);border-radius:5px;font-size:10.5px;line-height:1;padding:2px 4px;cursor:pointer;color:var(--ink-2)}
  .imgcard .ops button:hover{background:var(--surface-2)}
  .imgcard .ops button.del{color:var(--bad)}

  /* ---------- variants ---------- */
  .vbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:12px}
  .opts{display:grid;gap:8px}
  .orate{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr);gap:8px}
  @media(max-width:620px){.orate{grid-template-columns:1fr}}
  .bulkbar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong)}
  .bulkbar .fld{width:112px}
  .vt-wrap{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);max-height:none}
  .vt{display:grid;grid-template-columns:minmax(150px,1.5fr) 94px 84px 74px minmax(140px,1.3fr);gap:6px;align-items:center;padding:4px 8px;min-width:660px}
  .vt.head{position:sticky;top:0;background:#f2f4f7;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px;z-index:1}
  .vt.head span:nth-child(2),.vt.head span:nth-child(3),.vt.head span:nth-child(4){text-align:right}
  .vt.vrow{border-bottom:1px solid #f2f4f7}
  .vt.vrow:nth-child(even){background:#fcfcfd}
  .vt.vrow:last-child{border-bottom:0}
  .vt.vrow input{padding:5px 7px;font-size:12.5px;border-radius:6px}
  .vt.vrow input[type=number]{text-align:right}
  .vname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .vin{width:100%;padding:5px 6px;font-size:12px;border:1px solid var(--line-strong);border-radius:6px}
  .vfoot{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:8px 2px 0;font-weight:600}
  .vfoot b{color:var(--ink)}
  .empty{padding:18px;text-align:center;color:var(--muted);font-size:12.5px}

  /* ---------- settings / reviews / orders ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
  .card[data-dirty]{border-color:#f79009;box-shadow:0 0 0 3px rgba(247,144,9,.12)}
  .settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  @media(max-width:900px){.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:620px){.settings-grid{grid-template-columns:1fr}}
  .fp{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;margin-bottom:8px;background:var(--surface-2)}
  .kv{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
  .muted{color:var(--muted)}
  .right{margin-left:auto}
  code{background:#eceff3;padding:1px 5px;border-radius:5px;font-size:12px}
  .hidden{display:none !important}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <span class="brand"><span class="dot"></span>Dealerama</span>
    <span class="spacer"></span>
    <a class="btn btn-sm" href="/" target="_blank" rel="noopener">View site</a>
    <button id="sync" class="btn btn-sm">Sync payments</button>
    <button id="out" class="btn btn-sm">Log out</button>
    <button id="save" class="btn btn-primary">Save</button>
  </div>
</header>

<div class="wrap">
  <div id="msg" role="status" aria-live="polite"></div>

  <section id="login" class="login">
    <h1>Admin</h1>
    <p>Enter the admin secret printed by <code>setup()</code> or <code>newAdminSecret()</code> in Apps Script.</p>
    <label><span class="lbl">Admin secret</span>
      <input id="key" type="password" autocomplete="current-password" placeholder="••••••••••••">
    </label>
    <button id="go" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:14px">Sign in</button>
  </section>

  <div id="app" class="hidden">
    <div class="kpis" id="kpis"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="pane-products" role="tabpanel"></div>
    <div id="pane-reviews" class="hidden" role="tabpanel"></div>
    <div id="pane-settings" class="hidden" role="tabpanel"></div>
    <div id="pane-orders" class="hidden" role="tabpanel"></div>
  </div>
</div>

<script src="site.js"></script>
<script>
/* ------------------------------------------------------------------ *
 * Helpers — every string op is guarded so a missing value can never
 * throw "... of undefined".
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const txt = (v) => (v == null ? '' : String(v));
const trim = (v) => txt(v).trim();
const numOr = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const val = (el) => (el && typeof el.value === 'string' ? el.value : '');
const escAttr = (v) => esc(txt(v));
const opt = (value, list) => list.map((x) => `<option value="${escAttr(x)}"${x === value ? ' selected' : ''}>${esc(txt(x) || '—')}</option>`).join('');
const money2 = (n) => '$' + numOr(n, 0).toFixed(2);

let K = sessionStorage.getItem('k') || '';
let D = null;
let openId = null;
let filter = 'all';
let query = '';
let settingsDirty = false;
let saving = false;
let serverVersion = '';
let toastTimer = null;

const call = (action, extra = {}) => api({ action, secret: K, ...extra });

function say(message, kind = 'ok', sticky = false) {
  const el = $('msg');
  el.className = 'toast show ' + kind;
  el.textContent = txt(message);
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => { el.className = 'toast'; el.textContent = ''; }, 4500);
}

/** Backend must be >= 5.1.0 to persist manual sold edits. */
function supportsSoldEditing() {
  const parts = txt(serverVersion).split('.').map((n) => numOr(n, 0));
  if (!parts.length || !txt(serverVersion)) return false;
  const [a, b] = parts;
  return a > 5 || (a === 5 && b >= 1);
}

/* ------------------------------------------------------------------ *
 * Load
 * ------------------------------------------------------------------ */
async function load() {
  let data;
  try {
    data = await call('adminGet');
  } catch (e) {
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    const m = txt(e && e.message);
    if (/Unauthorized/i.test(m)) say('That admin secret was not accepted. Use the one from setup() or newAdminSecret().', 'bad', true);
    else if (/Missing tab|setup\(\)/i.test(m)) say('The Google Sheet is not set up yet — run setup() in Apps Script.', 'bad', true);
    else if (/Network error|Failed to fetch|not found/i.test(m)) say(m + ' — check that the API function is deployed and APPS_SCRIPT_URL is set.', 'bad', true);
    else say(m, 'bad', true);
    return;
  }

  D = data;
  serverVersion = txt(D.version);
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  settingsDirty = false;

  try {
    renderKpis();
    renderTabs();
    renderProducts();
    renderReviews();
    renderSettings();
    renderOrders();
    showTab();
    updateSaveButton();
    say('');
  } catch (e) {
    console.error(e);
    say('Signed in, but the page failed to render: ' + txt(e && e.message), 'bad', true);
  }
}

$('go').onclick = () => { K = trim($('key').value); sessionStorage.setItem('k', K); load(); };
$('key').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = () => { sessionStorage.clear(); location.reload(); };
$('sync').onclick = async () => {
  try {
    const r = await call('syncPayments');
    await load();
    say((r.updated || 0) + ' paid order(s) applied.');
  } catch (e) { say(txt(e.message), 'bad'); }
};

/* ------------------------------------------------------------------ *
 * Shell: KPIs + tabs
 * ------------------------------------------------------------------ */
function renderKpis() {
  const products = D.products || [];
  const counts = products.reduce((acc, p) => { const s = txt(p.status); acc[s] = (acc[s] || 0) + 1; return acc; }, {});
  const orders = D.orders || [];
  const revenue = orders.filter((o) => txt(o.status) === 'paid').reduce((sum, o) => sum + numOr(o.amount, 0), 0);
  const kpis = [
    { n: products.length, l: 'Products' },
    { n: counts.live || 0, l: 'Live' },
    { n: (counts.draft || 0), l: 'Drafts' },
    { n: orders.length ? money2(revenue) : '0', l: 'Paid revenue' }
  ];
  $('kpis').innerHTML = kpis.map((k) => `<div class="kpi"><div class="n">${esc(txt(k.n))}</div><div class="l">${esc(k.l)}</div></div>`).join('');
}

const TABS = ['products', 'reviews', 'settings', 'orders'];
function renderTabs() {
  const counts = { products: (D.products || []).length, reviews: (D.reviews || []).length, orders: (D.orders || []).length };
  $('tabs').innerHTML = TABS.map((t) => `<button role="tab" data-tab="${t}" aria-selected="${t === currentTab()}">
      ${t[0].toUpperCase() + t.slice(1)}${counts[t] != null ? `<span class="count">${counts[t]}</span>` : ''}
    </button>`).join('');
  $('tabs').querySelectorAll('button').forEach((b) => {
    b.onclick = () => { setTab(b.dataset.tab); };
  });
}
let tab = 'products';
const currentTab = () => tab;
function setTab(next) {
  tab = next;
  TABS.forEach((t) => $('pane-' + t).classList.toggle('hidden', t !== tab));
  $('tabs').querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
}
function showTab() { setTab(tab); }

/* ------------------------------------------------------------------ *
 * Products list
 * ------------------------------------------------------------------ */
function variantSummary(p) {
  if (!p.variants || !p.variants.options || !p.variants.options.length) return '';
  return p.variants.options.map((o) => `${txt(o.name)} ×${(o.values || []).length}`).join(' · ');
}

function productRow(p) {
  const images = Array.isArray(p.images) ? p.images : [];
  const qty = p.variants ? (p.variants.items || []).reduce((a, i) => a + numOr(i.qty, 0), 0) : numOr(p.qty, 0);
  const sold = p.variants ? (p.variants.items || []).reduce((a, i) => a + numOr(i.sold, 0), 0) : numOr(p.sold, 0);
  const vs = variantSummary(p);
  return `<article class="prow" data-pid="${escAttr(p.id)}" data-status="${escAttr(p.status)}"
      data-search="${escAttr((txt(p.title) + ' ' + txt(p.description)).toLowerCase())}">
    <button type="button" class="prow-main" data-toggle aria-expanded="false">
      <img class="thumb" src="${escAttr(images[0] || PLACEHOLDER)}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async">
      <span>
        <span class="prow-title">${esc(txt(p.title))}</span>
        <span class="prow-meta">
          <span class="badge ${escAttr(txt(p.status))}">${esc(txt(p.status))}</span>
          <span>${money2(p.basePrice)}</span>
          <span class="sep">·</span>
          <span>stock <b>${qty}</b></span>
          <span class="sep">·</span>
          <span>sold <b>${sold}</b></span>
          ${p.variants ? `<span class="sep">·</span><span>${(p.variants.items || []).length} variants</span>` : ''}
          ${vs ? `<span class="sep">·</span><span>${esc(vs)}</span>` : ''}
          <span class="dirty-dot" title="Unsaved changes"></span>
        </span>
      </span>
      <span></span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="pedit" hidden></div>
  </article>`;
}

function renderProducts() {
  const products = D.products || [];
  $('pane-products').innerHTML = `
    <div class="toolbar">
      <button id="newp" class="btn btn-primary btn-sm">+ New product</button>
      <div class="search"><span class="icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search products…" value="${escAttr(query)}" aria-label="Search products">
      </div>
      <input id="impu" type="url" placeholder="Paste a product link to import" style="flex:1;min-width:220px" aria-label="Product link to import">
      <button id="imp" class="btn btn-sm">Import</button>
    </div>
    <div class="chips" id="filters" role="group" aria-label="Filter by status">
      ${['all', 'live', 'draft', 'upcoming', 'archived'].map((f) => `<button class="chip" data-f="${f}" aria-pressed="${filter === f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}
    </div>
    <div id="plist">${products.map(productRow).join('')}</div>
    <div class="card hidden" id="emptyProducts"><div class="empty">No products match this filter.</div></div>`;

  $('filters').querySelectorAll('button').forEach((b) => {
    b.onclick = () => { filter = b.dataset.f; applyFilter(); };
  });
  const search = $('search');
  if (search) search.oninput = () => { query = trim(search.value).toLowerCase(); applyFilter(); };

  $('newp').onclick = async () => {
    try { await call('createProduct'); await load(); say('Product created as a draft.'); }
    catch (e) { say(txt(e.message), 'bad'); }
  };
  $('imp').onclick = async () => {
    const url = trim(val($('impu')));
    if (!url) return;
    $('imp').disabled = true;
    say('Importing — this can take up to 30s…', 'warn', true);
    try {
      const r = await call('importUrl', { url });
      await load();
      say('Imported as draft with ' + ((r.images || []).length) + ' image(s).');
    } catch (e) { say(txt(e.message), 'bad'); }
    $('imp').disabled = false;
  };

  document.querySelectorAll('#pane-products [data-pid]').forEach((row) => wireProductCard(row));
  applyFilter();
  if (openId) openProduct(openId, true);
}

function applyFilter() {
  let visible = 0;
  document.querySelectorAll('#pane-products [data-pid]').forEach((row) => {
    const show = (filter === 'all' || row.dataset.status === filter) && (!query || txt(row.dataset.search).includes(query));
    row.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.querySelectorAll('#filters button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === filter)));
  const empty = $('emptyProducts');
  if (empty) empty.classList.toggle('hidden', visible > 0);
}

function rowFor(id) {
  return [...document.querySelectorAll('#pane-products [data-pid]')].find((r) => r.dataset.pid === id) || null;
}
function productFor(id) {
  return (D.products || []).find((p) => p.id === id) || null;
}

function wireProductCard(row) {
  if (!row || typeof row.querySelector !== 'function') return;
  const id = row.dataset.pid;
  const toggle = row.querySelector('[data-toggle]');
  if (toggle) toggle.onclick = () => toggleProduct(id);
  row.addEventListener('input', () => markDirty(row));
  row.addEventListener('change', () => markDirty(row));
}

function markDirty(row) {
  row.dataset.dirty = '1';
  updateSaveButton();
}

function toggleProduct(id) {
  if (openId === id) { closeProduct(id); return; }
  if (openId) closeProduct(openId);
  openProduct(id);
}

function openProduct(id, keepOpen) {
  const row = rowFor(id);
  const product = productFor(id);
  if (!row || !product) return;
  const editor = row.querySelector('.pedit');
  if (editor && editor.dataset.rendered !== '1') {
    editor.innerHTML = editorHtml(product);
    wireEditor(editor, product);
    editor.dataset.rendered = '1';
  }
  if (editor) editor.hidden = false;
  row.classList.add('open');
  const toggle = row.querySelector('[data-toggle]');
  if (toggle) toggle.setAttribute('aria-expanded', 'true');
  openId = id;
  if (!keepOpen) {
    const top = row.getBoundingClientRect ? row.getBoundingClientRect().top : 0;
    if (top < 70) row.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
}

function closeProduct(id) {
  const row = rowFor(id);
  if (!row) return;
  const editor = row.querySelector('.pedit');
  if (editor) editor.hidden = true;
  row.classList.remove('open');
  const toggle = row.querySelector('[data-toggle]');
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
  if (openId === id) openId = null;
}

/* ------------------------------------------------------------------ *
 * Product editor
 * ------------------------------------------------------------------ */
function editorHtml(p) {
  const variants = p.variants && Array.isArray(p.variants.items) ? p.variants : null;
  const options = variants && Array.isArray(variants.options) ? variants.options : [];
  const images = Array.isArray(p.images) ? p.images : [];
  const soldLocked = !supportsSoldEditing();
  const optRows = (options.length ? options : [{ name: '', values: [] }]).map(optionRowHtml).join('');

  return `
  <div class="sect">
    <div class="sect-head"><h3>Basics</h3><span class="spacer"></span>
      <button type="button" class="btn btn-sm" data-revert>Revert changes</button>
    </div>
    <div class="grid g2">
      <label><span class="lbl">Title *</span><input data-f="title" value="${escAttr(p.title)}" required>

      <label class="checkline" style="align-self:end"><input type="checkbox" data-f="preorder" ${p.preorder ? 'checked' : ''}> Pre-order</label>
      <label class="checkline" style="align-self:end;color:var(--bad)"><input type="checkbox" class="del" data-f="_del"> Delete on save</label>
    </div>
  </div>

  <div class="sect">
    <div class="sect-head"><h3>Pricing &amp; stock</h3>
      ${variants ? '<span class="badge">per-variant stock</span>' : ''}
      ${soldLocked ? '<span class="badge" style="background:#fef3f2;color:#b42318">read-only</span>' : ''}
    </div>
    <div class="grid g4">
      <label><span class="lbl">Base price ($) *</span><input data-f="price" type="number" step="0.01" min="0" value="${escAttr(p.basePrice)}">

      <label><span class="lbl">Stock${variants ? ' (sum of variants)' : ''}</span>

      <label><span class="lbl">Sold${variants ? ' (sum of variants)' : ''}</span>
        <input data-f="sold" type="number" min="0" step="1" value="${variants ? 0 : numOr(p.sold, 0)}" ${variants || soldLocked ? 'disabled' : ''} title="${soldLocked ? 'Update Code.gs to 5.1 to edit Sold' : ''}">
        <span class="err" data-err="sold"></span></label>
      <label><span class="lbl">Offline sale</span>
        <input data-f="offline" type="number" min="0" step="1" placeholder="0" ${variants ? 'disabled title="Use the variants table"' : ''}>
        <span class="hint">Adds to Sold and deducts from Stock.</span></label>
    </div>
    ${soldLocked
      ? `<p class="hint" style="color:#b42318;font-weight:700">Sold is read-only: the deployed backend is ${esc(serverVersion || 'older than 5.1')}. Paste the current <code>apps-script/Code.gs</code> into Apps Script and redeploy to enable manual sold editing.</p>`
      : '<p class="hint">Editing Stock or Sold directly is for corrections and offline sales. Online orders adjust both automatically.</p>'}
  </div>

  <div class="sect">
    <div class="sect-head"><h3>Images</h3><span class="spacer"></span>
      <span class="badge" data-img-count>${images.length}</span>
    </div>
    <label><span class="lbl">Image URLs — one per line, first is the cover</span>
      <textarea data-f="images" rows="3">${esc(images.join('\n'))}</textarea>
      <span class="err" data-err="images"></span></label>
    <div class="thumbs" data-thumbs>${thumbsHtml(images)}</div>
    <div class="row" style="margin-top:10px">
      <label class="btn btn-sm" style="display:inline-flex;margin:0">
        <input type="file" accept="image/*" class="upl" hidden> Add photo from device
      </label>
      <span class="hint" style="margin:0">Uploads are hosted on ImgBB.</span>
    </div>
  </div>

  <div class="sect">
    <div class="sect-head"><h3>Description</h3></div>
    <label><span class="lbl">HTML allowed</span><textarea data-f="description" rows="5">${esc(txt(p.description))}</textarea></label>
  </div>

  <div class="sect">
    <div class="sect-head">
      <h3>Variants</h3>
      <span class="badge" data-vcount>${variants ? (variants.items || []).length + ' rows' : 'none'}</span>
      <span class="spacer"></span>
      <button type="button" class="btn btn-sm" data-addopt>+ Option</button>

function optionRowHtml(o) {
  const name = txt(o && o.name);
  const values = (o && Array.isArray(o.values) ? o.values : []).join(', ');
  return `<div class="orate">
    <label><span class="lbl">Option name</span><input data-oname value="${escAttr(name)}" placeholder="Color"></label>
    <label><span class="lbl">Values, comma separated</span><input data-ovals value="${escAttr(values)}" placeholder="Black, Navy, Green"></label>
  </div>`;
}

function thumbsHtml(images) {
  const list = (images || []).filter(Boolean);
  if (!list.length) return '<span class="hint">No images yet.</span>';
  return list.map((u, i) => `<div class="imgcard">
      ${i === 0 ? '<span class="cover">cover</span>' : ''}
      <img src="${escAttr(u)}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async"
           onerror="this.style.opacity=.25;this.title='Image failed to load'">
      <div class="ops">
        <button type="button" data-img="up" data-i="${i}" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" data-img="down" data-i="${i}" title="Move down" ${i === list.length - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="del" data-img="del" data-i="${i}" title="Remove">✕</button>
      </div>
    </div>`).join('');
}

function variantTableHtml(items, soldLocked) {
  if (!items || !items.length) return '<div class="empty">No variant rows. Add options above and press <b>Build grid</b>.</div>';
  const head = '<div class="vt head"><span>Variant</span><span>Price</span><span>Stock</span><span>Sold</span><span>Image URL</span></div>';
  const rows = items.map((it) => {
    const key = txt(it.key);
    const label = key.split('|').join(' / ');
    return `<div class="vt vrow" data-vkey="${escAttr(key)}" data-vsold="${numOr(it.sold, 0)}">
      <span class="vname" title="${escAttr(label)}">${esc(label)}</span>
      <input data-vp type="number" step="0.01" min="0" value="${it.price == null || it.price === '' ? '' : escAttr(it.price)}" placeholder="base" aria-label="${escAttr(label)} price">
      <input data-vq type="number" min="0" step="1" value="${numOr(it.qty, 0)}" aria-label="${escAttr(label)} stock">
      <input data-vs type="number" min="0" step="1" value="${numOr(it.sold, 0)}" ${soldLocked ? 'disabled' : ''} aria-label="${escAttr(label)} sold">
      <input data-vi value="${escAttr(it.image)}" placeholder="https://…" aria-label="${escAttr(label)} image">
    </div>`;
  }).join('');
  return head + rows;
}

function wireEditor(editor, product) {
  const box = editor;
  const options = () => box.querySelector('[data-opts]');
  const table = () => box.querySelector('[data-vtable]');
  const hidden = () => box.querySelector('[data-f="variants"]');

  const mark = () => markDirty(box.closest('[data-pid]'));

  box.addEventListener('input', (e) => {
    if (e.target && e.target.closest && e.target.closest('.vbox')) syncVariants(box);
    if (e.target && e.target.matches && e.target.matches('[data-f="images"]')) refreshThumbs(box);
    mark();
  });
  box.addEventListener('change', mark);

  box.querySelector('[data-addopt]').onclick = () => {
    if (options().querySelectorAll('.orate').length >= 3) { say('At most 3 options.', 'warn'); return; }
    options().insertAdjacentHTML('beforeend', optionRowHtml({ name: '', values: [] }));
    mark();
  };
  box.querySelector('[data-build]').onclick = () => buildGrid(box);
  box.querySelector('[data-clear]').onclick = () => {
    if (!confirm('Clear all options and variant rows? Price, stock and sold on these rows will be lost when you save.')) return;
    options().innerHTML = optionRowHtml({ name: '', values: [] });
    table().innerHTML = variantTableHtml([], !supportsSoldEditing());
    if (hidden()) hidden().value = '';
    updateVariantSummary(box);
    mark();
  };
  box.querySelector('[data-applyprice]').onclick = () => {
    const v = trim(val(box.querySelector('[data-bulkprice]')));
    if (v === '') return;
    box.querySelectorAll('.vrow [data-vp]').forEach((i) => { i.value = v; });
    syncVariants(box); mark();
  };
  box.querySelector('[data-applystock]').onclick = () => {
    const v = trim(val(box.querySelector('[data-bulkstock]')));
    if (v === '') return;
    box.querySelectorAll('.vrow [data-vq]').forEach((i) => { i.value = v; });
    syncVariants(box); mark();
  };
  const applySold = box.querySelector('[data-applysold]');
  if (applySold) applySold.onclick = () => {
    const v = trim(val(box.querySelector('[data-bulksold]')));
    if (v === '') return;
    box.querySelectorAll('.vrow [data-vs]').forEach((i) => { i.value = v; });
    syncVariants(box); mark();
  };

  box.querySelector('[data-revert]').onclick = () => revertProduct(product.id);

  const thumbs = box.querySelector('[data-thumbs]');
  if (thumbs) {
    thumbs.addEventListener('click', (e) => {
      const btn = e.target && e.target.closest ? e.target.closest('[data-img]') : null;
      if (!btn) return;
      const area = box.querySelector('[data-f="images"]');
      const list = trim(val(area)).split('\n').map((s) => trim(s)).filter(Boolean);
      const i = numOr(btn.dataset.i, -1);
      if (i < 0 || i >= list.length) return;
      const op = btn.dataset.img;
      if (op === 'del') list.splice(i, 1);
      else if (op === 'up' && i > 0) { const t = list[i - 1]; list[i - 1] = list[i]; list[i] = t; }
      else if (op === 'down' && i < list.length - 1) { const t = list[i + 1]; list[i + 1] = list[i]; list[i] = t; }
      area.value = list.join('\n');
      refreshThumbs(box);
      mark();
    });
  }

  const upload = box.querySelector('.upl');
  if (upload) {
    upload.onchange = async () => {
      const file = upload.files && upload.files[0];
      if (!file) return;
      say('Uploading photo…', 'warn', true);
      try {
        const r = await call('uploadImage', { data: await shrink(file) });
        const area = box.querySelector('[data-f="images"]');
        const current = trim(val(area));
        area.value = (current ? current + '\n' : '') + r.url;
        refreshThumbs(box);
        mark();
        say('Photo added — press Save.');
      } catch (e) { say(txt(e.message), 'bad'); }
      upload.value = '';
    };
  }

  const del = box.querySelector('.del');
  if (del) del.onchange = () => { if (del.checked && !confirm('Delete this product when you press Save?')) del.checked = false; };

  syncVariants(box);
}

function readOptions(box) {
  return [...box.querySelectorAll('.orate')].map((row) => ({
    name: trim(val(row.querySelector('[data-oname]'))),
    values: trim(val(row.querySelector('[data-ovals]'))).split(',').map((s) => trim(s).replace(/\|/g, '/')).filter(Boolean)
  })).filter((o) => o.name && o.values.length).slice(0, 3);
}

function readVariantRows(box) {
  return [...box.querySelectorAll('.vrow')].map((row) => ({
    key: txt(row.dataset.vkey),
    price: trim(val(row.querySelector('[data-vp]'))),
    qty: trim(val(row.querySelector('[data-vq]'))),
    sold: trim(val(row.querySelector('[data-vs]'))),
    image: trim(val(row.querySelector('[data-vi]')))
  }));
}

function syncVariants(box) {
  const options = readOptions(box);
  const items = readVariantRows(box);
  const hidden = box.querySelector('[data-f="variants"]');
  if (hidden) hidden.value = options.length && items.length ? JSON.stringify({ options, items }) : '';
  updateVariantSummary(box);
}

function updateVariantSummary(box) {
  const items = readVariantRows(box);
  const badge = box.querySelector('[data-vcount]');
  if (badge) badge.textContent = items.length ? items.length + ' rows' : 'none';
  const foot = box.querySelector('[data-vfoot]');
  if (foot) {
    if (!items.length) { foot.innerHTML = ''; return; }
    const stock = items.reduce((a, i) => a + numOr(i.qty, 0), 0);
    const sold = items.reduce((a, i) => a + numOr(i.sold, 0), 0);
    foot.innerHTML = `<span>Rows: <b>${items.length}</b></span><span>Total stock: <b>${stock}</b></span><span>Total sold: <b>${sold}</b></span>`;
  }
}

function buildGrid(box) {
  const options = readOptions(box);
  const previous = {};
  readVariantRows(box).forEach((r) => { previous[r.key] = r; });
  let combos = [[]];
  options.forEach((o) => {
    const next = [];
    combos.forEach((combo) => o.values.forEach((v) => { if (next.length < 150) next.push(combo.concat([v])); }));
    combos = next;
  });
  const items = options.length ? combos.map((values) => {
    const key = values.join('|');
    const old = previous[key] || {};
    return { key, price: old.price != null ? old.price : '', qty: old.qty != null ? old.qty : 0, sold: old.sold != null ? old.sold : 0, image: old.image || '' };
  }) : [];
  box.querySelector('[data-vtable]').innerHTML = variantTableHtml(items, !supportsSoldEditing());
  syncVariants(box);
  markDirty(box.closest('[data-pid]'));
}

function refreshThumbs(box) {
  const area = box.querySelector('[data-f="images"]');
  const list = trim(val(area)).split('\n').map((s) => trim(s)).filter(Boolean);
  const holder = box.querySelector('[data-thumbs]');
  if (holder) holder.innerHTML = thumbsHtml(list);
  const count = box.querySelector('[data-img-count]');
  if (count) count.textContent = String(list.length);
}

function revertProduct(id) {
  const row = rowFor(id);
  const product = productFor(id);
  if (!row || !product) return;
  const editor = row.querySelector('.pedit');
  if (!editor) return;
  if (row.dataset.dirty && !confirm('Discard unsaved changes to this product?')) return;
  editor.innerHTML = editorHtml(product);
  wireEditor(editor, product);
  editor.dataset.rendered = '1';
  delete row.dataset.dirty;
  updateSaveButton();
  say('Reverted.');
}

function shrink(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 2000 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.9).split(',')[1]);
    };
    img.onerror = () => resolve('');
    img.src = URL.createObjectURL(file);
  });
}

/* ------------------------------------------------------------------ *
 * Reviews / settings / orders
 * ------------------------------------------------------------------ */
function renderReviews() {

  $('pane-reviews').innerHTML = `
    <div class="card">
      <h2>Add a review from a real customer</h2>
      <p class="hint">Only for feedback you can reference with an order number or email. Customer submissions appear below as pending.</p>
      <div class="grid g4" style="margin-top:12px">
        <label><span class="lbl">Product</span><select id="np">${productOptions}</select></label>
        <label><span class="lbl">Customer name</span><input id="nn" placeholder="Jane D."></label>
        <label><span class="lbl">Order ref / email</span><input id="no" placeholder="ORD-123"></label>
        <label><span class="lbl">Stars</span><select id="ns"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
      </div>
      <label style="margin-top:12px"><span class="lbl">Their words</span><textarea id="nt" rows="3" placeholder="Saved with the main Save button"></textarea></label>
    </div>
    ${(D.reviews || []).map((r) => `<article class="card" data-rid="${escAttr(r.id)}">
        <div class="row"><span>${stars(r.stars)}</span><b>${esc(txt(r.name))}</b>
          <span class="muted">${esc(txt(r.email) || txt(r.orderRef))}</span>
          <span class="spacer"></span><span class="badge ${escAttr(txt(r.status))}">${esc(txt(r.status))}</span></div>
        <p style="margin:10px 0 12px">${esc(txt(r.text))}</p>
        <div class="grid g3">
          <label><span class="lbl">Status</span><select data-f="status">${opt(r.status, ['shown', 'hidden', 'pending'])}</select></label>
          <label><span class="lbl">Seller reply</span><input data-f="reply" value="${escAttr(r.reply)}" placeholder="Thanks!"></label>
          <label class="checkline" style="align-self:end;color:var(--bad)"><input type="checkbox" data-f="_del"> Delete on save</label>
        </div>
      </article>`).join('') || '<div class="card"><div class="empty">No reviews yet.</div></div>'}`;

  $('pane-reviews').querySelectorAll('[data-rid]').forEach((card) => {
    card.addEventListener('input', () => { card.dataset.dirty = '1'; updateSaveButton(); });
    card.addEventListener('change', () => { card.dataset.dirty = '1'; updateSaveButton(); });
  });
}

const OPTS = { font_body: FONTS, font_heading: FONTS, heading_weight: ['400', '700'], heading_style: ['normal', 'italic'], heading_transform: ['none', 'uppercase', 'capitalize'], review_mode: ['moderate', 'auto'], grid_cols: ['2', '3', '4'] };
const GROUPS = {
  'Brand & colours': ['site_name', 'logo_url', 'primary_color', 'accent_color', 'price_color', 'text_color', 'bg_color', 'nav_bg', 'footer_bg', 'card_radius', 'button_radius'],
  'Fonts': ['font_body', 'font_heading', 'heading_weight', 'heading_style', 'heading_transform', 'font_scale'],
  'Homepage': ['hero_on', 'hero_title', 'hero_sub', 'hero_image_url', 'grid_cols', 'title_live', 'title_upcoming', 'title_past', 'badge_daily', 'badge_weekly', 'view_label', 'buy_label', 'preorder_label'],
  'Promo banner': ['banner_on', 'banner_text', 'banner_color'],
  'Features': ['reviews_on', 'review_mode', 'stock_bar_on', 'stock_bar_color', 'stock_low_at'],
  'Store': ['site_url', 'business_name', 'contact_email', 'ship_days', 'return_days', 'google_client_id'],
  'Footer': ['footer_on', 'footer_text']
};

function field(key, value) {
  const v = txt(value);
  if (OPTS[key]) return `<select data-k="${escAttr(key)}">${opt(v, OPTS[key])}</select>`;
  if (key.endsWith('_color') || key.endsWith('_bg')) return `<input type="color" data-k="${escAttr(key)}" value="${escAttr(v)}">`;
  if (v === 'true' || v === 'false') return `<input type="checkbox" role="switch" data-k="${escAttr(key)}" ${v === 'true' ? 'checked' : ''}>`;
  if (key === 'font_scale') return `<input type="number" step="0.05" min="0.7" max="1.6" data-k="${escAttr(key)}" value="${escAttr(v)}">`;
  if (key === 'footer_pages') return `<input type="hidden" data-k="${escAttr(key)}" value="${escAttr(v)}">`;
  return `<input data-k="${escAttr(key)}" value="${escAttr(v)}">`;
}

function fpRows(pages) {
  const list = Array.isArray(pages) ? pages : [];
  $('fp').innerHTML = list.map((p) => `<div class="fp">
      <div class="row"><input data-ft placeholder="Link title" value="${escAttr(p.title)}" style="flex:1">
        <button type="button" class="btn btn-sm btn-danger fpd">Remove</button></div>
      <label style="margin-top:8px"><span class="lbl">Text — a new line becomes a new paragraph</span><textarea data-fb rows="4">${esc(txt(p.body))}</textarea></label>
    </div>`).join('') || '<div class="empty">No footer links.</div>';
  $('fp').querySelectorAll('.fpd').forEach((b) => { b.onclick = () => { b.closest('.fp').remove(); fpSync(); }; });
}

function fpSync() {
  const pages = [...document.querySelectorAll('#fp .fp')].map((d) => ({
    title: trim(val(d.querySelector('[data-ft]'))),
    body: txt(val(d.querySelector('[data-fb]')))
  })).filter((p) => p.title);
  const hidden = document.querySelector('#pane-settings [data-k="footer_pages"]');
  if (hidden) hidden.value = JSON.stringify(pages);
  settingsDirty = true;
  updateSaveButton();
}

function renderSettings() {
  const settings = D.settings || {};
  const keysSet = D.keysSet || {};
  $('pane-settings').innerHTML = Object.entries(GROUPS).map(([group, keys]) => `
      <section class="card">
        <h2>${group}</h2>
        <div class="settings-grid" style="margin-top:12px">
          ${keys.filter((k) => Object.prototype.hasOwnProperty.call(settings, k)).map((k) => `<label><span class="lbl">${k.replace(/_/g, ' ')}</span>${field(k, settings[k])}</label>`).join('')}
        </div>
        ${group === 'Footer' ? `<h3 style="margin-top:16px">Footer links (open as popups)</h3>
          <p class="hint">Placeholders: {business_name}, {contact_email}, {ship_days}, {return_days}. Template wording only — have it reviewed before launch.</p>
          <div id="fp" style="margin-top:10px"></div>
          <button type="button" id="fpa" class="btn btn-sm" style="margin-top:8px">+ Add link</button>` : ''}
      </section>`).join('') + `
      <section class="card">
        <h2>Private keys <span class="muted" style="font-size:12px;font-weight:600">write-only</span></h2>
        <p class="hint">Stored in Apps Script's script properties — never in the sheet, never shown again. Leave blank to keep the current value.</p>
        <div class="settings-grid" style="margin-top:12px">
          ${[['STRIPE_SECRET_KEY', 'Stripe secret key (restricted)'], ['IMGBB_API_KEY', 'ImgBB API key'], ['SECRET_KEY', 'New admin secret (12+ chars)']].map(([k, label]) => {
            const state = keysSet[k] === true ? '<span class="badge live">set</span>' : keysSet[k] === false ? '<span class="badge" style="background:#fef3f2;color:#b42318">not set</span>' : '';
            return `<label><span class="lbl">${label} ${state}</span><input type="password" autocomplete="new-password" data-secret="${escAttr(k)}" placeholder="••••••••"></label>`;
          }).join('')}
        </div>
      </section>`;

  fpRows(pagesFrom(settings));
  $('fpa').onclick = () => {
    const pages = [...document.querySelectorAll('#fp .fp')].map((d) => ({ title: trim(val(d.querySelector('[data-ft]'))), body: txt(val(d.querySelector('[data-fb]'))) }));
    pages.push({ title: 'New link', body: '' });
    fpRows(pages);
    fpSync();
  };
  $('pane-settings').oninput = (e) => {
    settingsDirty = true;
    if (e.target && e.target.closest && e.target.closest('#fp')) fpSync();
    updateSaveButton();
  };
}

function renderOrders() {
  const orders = D.orders || [];
  const names = {};
  (D.products || []).forEach((p) => { names[p.id] = p.title; });
  $('pane-orders').innerHTML = orders.length ? orders.map((o) => `<article class="card" data-oid="${escAttr(o.id)}">
      <div class="row">
        <b>${esc(txt(names[o.productId] || 'Product').slice(0, 70))}${o.variant ? ' — ' + esc(txt(o.variant)) : ''}</b>
        <span class="spacer"></span>
        <span class="muted">${esc(txt(o.createdAt).slice(0, 16).replace('T', ' '))} · qty ${numOr(o.qty, 0)} · ${money2(o.amount)}</span>
        <span class="badge ${txt(o.status) === 'paid' ? 'live' : ''}">${esc(txt(o.status))}</span>
      </div>
      <div class="kv" style="margin-top:8px"><span><b>${esc(txt(o.name) || '—')}</b></span><span>${esc(txt(o.email))}</span><span>${esc(txt(o.phone))}</span></div>
      <div class="kv"><span>${esc(txt(o.address) || 'no address')}</span></div>
      <div class="kv"><span>Paid with: ${esc(txt(o.payment) || 'n/a')}</span></div>
      <div class="grid g2" style="margin-top:12px">
        <label><span class="lbl">Shipping</span><select data-f="shipStatus">${opt(o.shipStatus, ['', 'processing', 'shipped', 'delivered', 'cancelled', 'refunded'])}</select></label>
        <label><span class="lbl">Tracking</span><input data-f="tracking" value="${escAttr(o.tracking)}" placeholder="Tracking number"></label>
      </div>
    </article>`).join('') : '<div class="card"><div class="empty">No orders yet.</div></div>';

  $('pane-orders').querySelectorAll('[data-oid]').forEach((card) => {
    card.addEventListener('input', () => { card.dataset.dirty = '1'; updateSaveButton(); });
    card.addEventListener('change', () => { card.dataset.dirty = '1'; updateSaveButton(); });
  });
}

/* ------------------------------------------------------------------ *
 * Collect + validate + save
 * ------------------------------------------------------------------ */
function collect(root) {
  const fields = {};
  root.querySelectorAll('[data-f]').forEach((el) => {
    if (el.disabled) return;
    const name = el.dataset.f;
    let value = el.type === 'checkbox' ? (el.checked ? 'TRUE' : 'FALSE') : val(el);
    if (name === 'images') value = txt(value).split('\n').map((s) => trim(s)).filter(Boolean);
    if (name === 'variants') {
      try { value = value ? JSON.parse(value) : { options: [], items: [] }; }
      catch (e) { value = { options: [], items: [] }; }
    }
    fields[name] = value;
  });
  return fields;
}

function validateProduct(fields) {
  const errors = [];
  if (!trim(fields.title)) errors.push(['title', 'A title is required.']);
  if (!(numOr(fields.price, -1) >= 0) || trim(fields.price) === '') errors.push(['price', 'Enter a price of 0 or more.']);
  if (fields.qty !== undefined && fields.qty !== '' && (!Number.isInteger(Number(fields.qty)) || Number(fields.qty) < 0)) errors.push(['qty', 'Stock must be a whole number.']);
  if (fields.sold !== undefined && fields.sold !== '' && (!Number.isInteger(Number(fields.sold)) || Number(fields.sold) < 0)) errors.push(['sold', 'Sold must be a whole number.']);
  if (Array.isArray(fields.images) && fields.images.some((u) => !/^https?:\/\//i.test(u))) errors.push(['images', 'Every image must be a full http(s) URL.']);
  const items = fields.variants && Array.isArray(fields.variants.items) ? fields.variants.items : [];
  items.forEach((it, i) => {
    if (!trim(it.key)) errors.push(['variants', 'Variant row ' + (i + 1) + ' has no key.']);
    ['qty', 'sold'].forEach((k) => {
      if (it[k] !== '' && it[k] != null && (!Number.isInteger(Number(it[k])) || Number(it[k]) < 0)) {
        errors.push(['variants', 'Variant "' + it.key + '": ' + k + ' must be a whole number.']);
      }
    });
    if (it.price !== '' && it.price != null && !(Number(it.price) >= 0)) {
      errors.push(['variants', 'Variant "' + it.key + '": price is invalid.']);
    }
  });
  return errors;
}

function showFieldErrors(editor, errors) {
  editor.querySelectorAll('[data-err]').forEach((e) => { e.className = 'err'; e.textContent = ''; });
  editor.querySelectorAll('[aria-invalid]').forEach((e) => e.removeAttribute('aria-invalid'));
  const seen = new Set();
  errors.forEach(([field, message]) => {
    const err = editor.querySelector('[data-err="' + field + '"]');
    if (err && !seen.has(field)) { err.className = 'err show'; err.textContent = message; seen.add(field); }
    const input = editor.querySelector('[data-f="' + field + '"]');
    if (input) input.setAttribute('aria-invalid', 'true');
  });
}

async function saveAll() {
  if (!D || saving) { if (!D) say('Sign in first.', 'bad'); return; }
  const rows = [...document.querySelectorAll('#pane-products [data-pid][data-dirty]')];
  const reviews = [...document.querySelectorAll('[data-rid][data-dirty]')];
  const orders = [...document.querySelectorAll('[data-oid][data-dirty]')];

  const payload = { products: [], reviews: [], orders: [] };
  const problems = [];

  rows.forEach((row) => {
    const editor = row.querySelector('.pedit');
    if (!editor || editor.dataset.rendered !== '1') return;
    const fields = collect(editor);
    const errors = validateProduct(fields);
    if (errors.length) {
      row.classList.add('open');
      editor.hidden = false;
      showFieldErrors(editor, errors);
      problems.push(...errors);
    }
    payload.products.push({ id: row.dataset.pid, fields });
  });

  if (problems.length) {
    const first = problems[0][1];
    say(problems.length + ' field' + (problems.length === 1 ? '' : 's') + ' need attention — ' + first, 'bad', true);
    const bad = document.querySelector('#pane-products [data-pid][data-dirty] [aria-invalid="true"]');
    if (bad && bad.scrollIntoView) bad.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (bad && bad.focus) bad.focus();
    return;
  }

  reviews.forEach((card) => { payload.reviews.push({ id: card.dataset.rid, ...collect(card) }); });
  orders.forEach((card) => { payload.orders.push({ id: card.dataset.oid, ...collect(card) }); });

  if (settingsDirty) {
    payload.settings = {};
    document.querySelectorAll('#pane-settings [data-k]').forEach((el) => {
      payload.settings[el.dataset.k] = el.type === 'checkbox' ? String(el.checked) : val(el);
    });
  }

  const keys = {};
  document.querySelectorAll('#pane-settings [data-secret]').forEach((el) => {
    const v = trim(val(el));
    if (v) keys[el.dataset.secret] = v;
  });
  if (Object.keys(keys).length) payload.keys = keys;

  const reviewText = trim(val($('nt')));
  if (reviewText) {
    if (!trim(val($('nn'))) || !trim(val($('no')))) { say('A manual review needs the customer name and an order reference.', 'bad', true); return; }
    payload.newReview = { productId: val($('np')), name: val($('nn')), orderRef: val($('no')), stars: val($('ns')), text: reviewText };
  }

  const nothing = !payload.products.length && !payload.reviews.length && !payload.orders.length && !payload.settings && !payload.keys && !payload.newReview;
  if (nothing) { say('Nothing changed.', 'warn'); return; }

  saving = true;
  updateSaveButton();
  say('Saving…', 'warn', true);
  try {
    await call('saveAll', payload);
    if (keys.SECRET_KEY) { K = keys.SECRET_KEY; sessionStorage.setItem('k', K); }
    const parts = [];
    if (payload.products.length) parts.push(payload.products.length + ' product' + (payload.products.length === 1 ? '' : 's'));
    if (payload.reviews.length) parts.push(payload.reviews.length + ' review' + (payload.reviews.length === 1 ? '' : 's'));
    if (payload.orders.length) parts.push(payload.orders.length + ' order' + (payload.orders.length === 1 ? '' : 's'));
    if (payload.settings) parts.push('settings');
    if (payload.keys) parts.push('private keys');
    if (payload.newReview) parts.push('1 review');
    const reopen = openId;
    await load();
    if (reopen) openProduct(reopen, true);
    say('Saved: ' + parts.join(', ') + '.');
  } catch (e) {
    console.error(e);
    say('Could not save: ' + txt(e && e.message), 'bad', true);
  }
  saving = false;
  updateSaveButton();
}

function updateSaveButton() {
  const dirty = document.querySelectorAll('[data-pid][data-dirty]').length
    + document.querySelectorAll('[data-rid][data-dirty]').length
    + document.querySelectorAll('[data-oid][data-dirty]').length
    + (settingsDirty ? 1 : 0);
  const btn = $('save');
  if (!btn) return;
  btn.textContent = saving ? 'Saving…' : dirty ? 'Save (' + dirty + ')' : 'Save';
  btn.disabled = saving;
}

$('save').onclick = saveAll;
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveAll(); }
});
window.addEventListener('beforeunload', (e) => {
  const dirty = document.querySelectorAll('[data-dirty]').length + (settingsDirty ? 1 : 0);
  if (dirty && !saving) { e.preventDefault(); e.returnValue = ''; }
});

if (K) load();
</script>
