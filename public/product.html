<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Dealerama</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .gallery-img { cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
  .gallery-img.active { border-color: #000; }
</style>
</head>
<body class="bg-white text-gray-900 font-sans">

<nav class="border-b p-6 bg-white sticky top-0 z-50">
  <a href="index.html" class="text-sm font-bold uppercase tracking-widest text-gray-500 hover:text-black transition">&larr; Back to Dealerama</a>
</nav>

<div id="loading" class="text-center py-32 text-gray-400">Loading product...</div>

<main id="product-content" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <div class="grid md:grid-cols-2 gap-16">

    <div>
      <div class="aspect-[4/5] bg-gray-50 rounded-2xl overflow-hidden mb-4 border border-gray-100 flex items-center justify-center">
        <img id="main-image" src="" referrerpolicy="no-referrer" class="w-full h-full object-contain p-4">
      </div>
      <div id="thumbnail-grid" class="grid grid-cols-4 gap-4"></div>
    </div>

    <div class="flex flex-col justify-center">
      <span class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Dealerama Exclusive</span>
      <h1 id="title" class="text-4xl md:text-5xl font-black mb-4 leading-tight"></h1>
      <p id="price" class="text-3xl font-bold text-gray-900 mb-8"></p>

      <a id="stripe-link" href="#" target="_blank" rel="noopener" class="bg-black hover:bg-gray-800 text-white text-center py-5 rounded-full font-bold text-lg mb-8 transition-colors shadow-lg">
        Buy Now with Stripe
      </a>

      <div class="border-t pt-8 mt-4">
        <h3 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Product Description</h3>
        <div id="description" class="text-gray-600 leading-relaxed text-sm space-y-4"></div>
      </div>
    </div>
  </div>
</main>

<script>
const PLACEHOLDER = 'https://placehold.co/600x600?text=No+Image';

// Keep only safe formatting tags from the scraped description
function sanitize(html) {
  const allowed = new Set(['P', 'BR', 'UL', 'OL', 'LI', 'B', 'STRONG', 'I', 'EM']);
  const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  const walk = (node) => {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 1) {
        if (!allowed.has(child.tagName)) {
          if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT'].includes(child.tagName)) { child.remove(); return; }
          walk(child);
          child.replaceWith(...child.childNodes);
        } else {
          [...child.attributes].forEach(a => child.removeAttribute(a.name));
          walk(child);
        }
      }
    });
  };
  walk(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}

async function loadProduct() {
  const loading = document.getElementById('loading');
  const productId = new URLSearchParams(window.location.search).get('id');
  if (!productId) { loading.textContent = 'No product ID provided.'; return; }

  try {
    const res = await fetch('/.netlify/functions/get-products');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const product = (data.products || []).find(p => String(p.id) === String(productId));
    if (!product) { loading.textContent = 'Product not found.'; return; }

    const price = Number(product.price);
    document.title = product.title + ' | Dealerama';
    document.getElementById('title').textContent = product.title;
    document.getElementById('price').textContent = `$${isNaN(price) || !product.price ? '0.00' : price.toFixed(2)}`;
    document.getElementById('description').innerHTML = product.description
      ? sanitize(String(product.description))
      : '<p>No description available.</p>';

    const buy = document.getElementById('stripe-link');
    if (product.stripeLink && /^https:\/\//.test(product.stripeLink)) {
      buy.href = product.stripeLink;
    } else {
      buy.style.display = 'none';
    }

    const main = document.getElementById('main-image');
    main.onerror = () => { main.onerror = null; main.src = PLACEHOLDER; };
    const images = product.images || [];
    main.src = images.length ? images[0] : PLACEHOLDER;

    const thumbGrid = document.getElementById('thumbnail-grid');
    if (images.length > 1) {
      images.forEach((imgUrl, i) => {
        const thumb = document.createElement('img');
        thumb.referrerPolicy = 'no-referrer';
        thumb.src = imgUrl;
        thumb.className = `gallery-img w-full aspect-square object-cover rounded-lg bg-gray-50 p-2 ${i === 0 ? 'active' : ''}`;
        thumb.onerror = () => thumb.remove();
        thumb.onclick = () => {
          main.src = imgUrl;
          document.querySelectorAll('.gallery-img').forEach(el => el.classList.remove('active'));
          thumb.classList.add('active');
        };
        thumbGrid.appendChild(thumb);
      });
    }

    loading.classList.add('hidden');
    document.getElementById('product-content').classList.remove('hidden');
  } catch (err) {
    loading.textContent = 'Failed to load product: ' + err.message;
  }
}
loadProduct();
</script>
</body>
</html>
