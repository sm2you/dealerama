<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Dealerama</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .gallery-img { cursor: pointer; border: 2px solid transparent; }
  .gallery-img.active { border-color: #000; }
</style>
</head>
<body class="bg-white text-gray-900 font-sans">
<nav class="border-b p-6"><a href="index.html" class="text-sm font-bold uppercase tracking-widest text-gray-500 hover:text-black">&larr; Back to Dealerama</a></nav>

<div id="loading" class="text-center py-32 text-gray-400">Loading product...</div>

<main id="product-content" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <div class="grid md:grid-cols-2 gap-16">
    
    <!-- Left Side: Images -->
    <div>
      <div class="aspect-[4/5] bg-gray-50 rounded-2xl overflow-hidden mb-4 border border-gray-100">
        <img id="main-image" src="" class="w-full h-full object-cover">
      </div>
      <div id="thumbnail-grid" class="grid grid-cols-4 gap-4"></div>
    </div>

    <!-- Right Side: Info -->
    <div class="flex flex-col justify-center">
      <span class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Dealerama Exclusive</span>
      <h1 id="title" class="text-4xl md:text-5xl font-black mb-4 leading-tight"></h1>
      <p id="price" class="text-3xl font-bold text-gray-900 mb-8"></p>
      
      <a id="stripe-link" href="#" target="_blank" class="bg-black hover:bg-gray-800 text-white text-center py-5 rounded-full font-bold text-lg mb-8 transition-colors shadow-lg">
        Buy Now with Stripe
      </a>

      <div class="border-t pt-8 mt-4">
        <h3 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Product Description</h3>
        <div id="description" class="text-gray-600 leading-relaxed text-sm space-y-4"></div>
      </div>
    </div>
  </div>
</main>
<script>
async function loadProduct() {
  const productId = new URLSearchParams(window.location.search).get('id');
  if (!productId) return;
  try {
    const res = await fetch('/.netlify/functions/get-products');
    const data = await res.json();
    const product = data.products.find(p => String(p.id) === String(productId));
    if (!product) return document.getElementById('loading').textContent = 'Not found.';
    document.getElementById('title').textContent = product.title;
    document.getElementById('price').textContent = `$${product.price}`;
    document.getElementById('description').innerHTML = product.description || '';
    document.getElementById('stripe-link').href = product.stripeLink || '#';
    if (product.images && product.images.length > 0) {
      document.getElementById('main-image').src = product.images[0];
      product.images.forEach((imgUrl, i) => {
        const thumb = document.createElement('img');
        thumb.src = imgUrl;
        thumb.className = `gallery-img w-full aspect-square object-cover rounded-md ${i === 0 ? 'active' : ''}`;
        thumb.onclick = () => {
          document.getElementById('main-image').src = imgUrl;
          document.querySelectorAll('.gallery-img').forEach(el => el.classList.remove('active'));
          thumb.classList.add('active');
        };
        document.getElementById('thumbnail-grid').appendChild(thumb);
      });
    }
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('product-content').classList.remove('hidden');
  } catch (err) {}
}
loadProduct();
</script>
</body>
</html>
