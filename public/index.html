<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealerama | Today's Hottest Deals</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #f9f9f9; font-family: system-ui, sans-serif; }
  .badge { position: absolute; top: 12px; left: 12px; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: bold; text-transform: uppercase; background: #ef4444; color: white; z-index: 10; }
  .product-card { transition: transform 0.2s; }
  .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
</style>
</head>
<body class="text-gray-800">
<nav class="bg-white shadow-sm p-6 mb-12">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-3xl font-black uppercase tracking-tighter">Dealerama</h1>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-6 pb-24">
  <h2 class="text-4xl font-bold mb-8">Today's Hottest Deals</h2>
  <div id="loading" class="text-center text-gray-400 py-12">Loading deals...</div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="product-grid"></div>
</main>
<script>
const PLACEHOLDER = 'https://placehold.co/400x400?text=No+Image';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadProducts() {
  const loading = document.getElementById('loading');
  try {
    const res = await fetch('/.netlify/functions/get-products');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (!data.products || data.products.length === 0) {
      loading.textContent = 'No deals active right now. Check back soon!';
      return;
    }
    loading.classList.add('hidden');

    const grid = document.getElementById('product-grid');
    grid.innerHTML = data.products.map(p => {
      const cover = (p.images && p.images.length > 0) ? p.images[0] : PLACEHOLDER;
      const plain = p.description
        ? String(p.description).replace(/<[^>]*>?/gm, '').substring(0, 80) + '...'
        : 'No description available.';
      const price = Number(p.price);
      const priceText = isNaN(price) || !p.price ? '0.00' : price.toFixed(2);
      const href = 'product.html?id=' + encodeURIComponent(p.id);

      return `
      <div class="product-card bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col relative">
        <span class="badge">${esc(p.dealType ? String(p.dealType).toUpperCase() : 'DEAL')}</span>
        <a href="${href}">
          <img src="${esc(cover)}" referrerpolicy="no-referrer" loading="lazy"
               onerror="this.onerror=null;this.src='${PLACEHOLDER}'"
               class="w-full h-64 object-contain bg-gray-50 p-4">
        </a>
        <div class="p-6 flex flex-col flex-grow">
          <a href="${href}"><h4 class="font-bold text-lg mb-2 hover:text-blue-600">${esc(p.title)}</h4></a>
          <p class="text-gray-500 text-sm mb-4 flex-grow">${esc(plain)}</p>
          <div class="flex justify-between items-center mt-auto">
            <span class="text-2xl font-black text-green-600">$${esc(priceText)}</span>
            <a href="${href}" class="bg-black hover:bg-gray-800 text-white px-6 py-2 rounded-full text-sm font-bold transition">View Deal</a>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    loading.textContent = 'Error loading products: ' + err.message;
  }
}
loadProducts();
</script>
</body>
</html>
