<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 16px; font-family: system-ui, sans-serif; text-align: center; }
    h3 { margin: 0 0 12px; }
    button { width: 100%; padding: 12px; cursor: pointer; background: #000; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; }
    button:disabled { background: #999; cursor: default; }
    #status { margin-top: 12px; font-size: 12px; color: #444; min-height: 16px; }
    #summary { margin-top: 10px; font-size: 12px; text-align: left; display: none; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px; }
    #summary div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
    #summary b { font-weight: 700; }
    .warn { color: #b45309; }
    .good { color: #047857; }
  </style>
</head>
<body>
  <h3>Dealerama Importer</h3>
  <button id="scrapeBtn">1. Scrape &amp; review</button>
  <div id="status">Ready.</div>
  <div id="summary"></div>
  <script src="popup.js"></script>
</body>
</html>
