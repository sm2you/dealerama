<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Dealerama</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .gallery-img { cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
  .gallery-img.active { border-color: #000; }
</style>
</head>
<body class="bg-white text-gray-900 font-sans">

<nav class="border-b p-6 bg-white sticky top-0 z-50">
  <a href="index.html" class="text-sm font-bold uppercase tracking-widest text-gray-500 hover:text-black transition">&larr; Back to Dealerama</a>
</nav>

<div id="loading" class="text-center py-32 text-gray-400">Loading product...</div>

<main id="product-content" class="max-w-6xl mx-auto px-6 py-12 hidden">
  <div class="grid md:grid-cols-2 gap-16">
    
    <div>
      <div class="aspect-[4/5] bg-gray-50 rounded-2xl overflow-hidden mb-4 border border-gray-100 flex items-center justify-center">
        <img id="main-image" src="" class="w-full h-full object-contain p-4">
      </div>
      <div id="thumbnail-grid" class="grid grid-cols-4 gap-4"></div>
    </div>

    <div class="flex flex-col justify-center">
      <span class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Dealerama Exclusive</span>
      <h1 id="title" class="text-4xl md:text-5xl font-black mb-4 leading-tight"></h1>
      <p id="price" class="text-3xl font-bold text-gray-900 mb-8"></p>
      
      <a id="stripe-link" href="#" target="_blank" class="bg-black hover:bg-gray-800 text-white text-center py-5 rounded-full font-bold text-lg mb-8 transition-colors shadow-lg">
        Buy Now with Stripe
      </a>

      <div class="border-t pt-8 mt-4">
        <h3 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4">Product Description</h3>
        <div id="description" class="text-gray-600 leading-relaxed text-sm space-y-4"></div>
      </div>
    </div>
  </div>
</main>

<script>
async function loadProduct() {
  const productId = new URLSearchParams(window.location.search).get('id');
  if (!productId) return document.getElementById('loading').textContent = 'No product ID provided.';

  try {
    const res = await fetch('/.netlify/functions/get-products');
    const data = await res.json();
    
    // Find the product by cleaning both IDs (removes apostrophes and spaces)
    const product = data.products.find(p => 
      String(p.id).replace(/'/g, '').trim() === String(productId).replace(/'/g, '').trim()
    );
    
    if (!product) {
      document.getElementById('loading').textContent = 'Product not found.';
      return;
    }

    document.getElementById('title').textContent = product.title;
    document.getElementById('price').textContent = `$${product.price || '0.00'}`;
    document.getElementById('description').innerHTML = product.description || '<p>No description available.</p>';
    document.getElementById('stripe-link').href = product.stripeLink || '#';

    if (product.images && product.images.length > 0) {
      // Clean main image
      let cleanMain = String(product.images[0]).replace(/[\[\]"]/g, '');
      document.getElementById('main-image').src = cleanMain;

      const thumbGrid = document.getElementById('thumbnail-grid');
      product.images.forEach((imgUrl, i) => {
        // Clean thumbnail images
        let cleanThumb = String(imgUrl).replace(/[\[\]"]/g, '');
        
        const thumb = document.createElement('img');
        thumb.src = cleanThumb;
        thumb.className = `gallery-img w-full aspect-square object-cover rounded-lg bg-gray-50 p-2 ${i === 0 ? 'active' : ''}`;
        
        thumb.onclick = () => {
          document.getElementById('main-image').src = cleanThumb;
          document.querySelectorAll('.gallery-img').forEach(el => el.classList.remove('active'));
          thumb.classList.add('active');
        };
        thumbGrid.appendChild(thumb);
      });
    }

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('product-content').classList.remove('hidden');
  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load product. Check connection.';
  }
}
loadProduct();
</script>
</body>
</html>
