<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Dealerama</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.thumb{cursor:pointer;border:2px solid transparent}.thumb.active{border-color:var(--p)}#lb{display:none}#lb.open{display:flex}</style>
</head>
<body class="text-gray-900">
<div id="banner" style="display:none" class="text-white text-center text-sm font-bold py-2 px-4"></div>
<nav class="border-b p-6 bg-white sticky top-0 z-40 flex justify-between items-center">
  <a href="index.html" class="text-sm font-bold uppercase tracking-widest text-gray-500 hover:text-black">&larr; Back</a>
  <a href="index.html" id="brand" class="text-xl font-black uppercase"></a>
</nav>
<div id="loading" class="text-center py-32 text-gray-400">Loading product...</div>

<main id="content" class="max-w-7xl mx-auto px-6 py-10 hidden">
  <div class="grid lg:grid-cols-[3fr_2fr] gap-12">
    <div>
      <div class="bg-white rounded-2xl border border-gray-100 flex items-center justify-center" style="height:min(80vh,720px)">
        <img id="main" src="" referrerpolicy="no-referrer" title="Click to enlarge" class="max-w-full max-h-full object-contain p-4 cursor-zoom-in">
      </div>
      <div id="thumbs" class="grid grid-cols-5 sm:grid-cols-6 gap-3 mt-4"></div>
    </div>
    <div>
      <h1 id="title" class="text-2xl md:text-3xl font-extrabold leading-snug mb-2"></h1>
      <div id="rating" class="mb-3 text-sm"></div>
      <p id="price" class="text-3xl font-black mb-1"></p>
      <p id="meta" class="text-sm text-gray-500 mb-2"></p>
      <div id="stock"></div>
      <div id="buyBox" class="mt-6">
        <div id="qtyRow" class="flex items-center gap-3 mb-4">
          <span class="text-sm font-bold">Qty</span>
          <button id="minus" class="w-10 h-10 rounded-full border text-xl">−</button>
          <input id="qty" value="1" readonly class="w-14 text-center border rounded-lg py-2 font-bold">
          <button id="plus" class="w-10 h-10 rounded-full border text-xl">+</button>
        </div>
        <button id="buy" class="btn-p w-full py-4 rounded-full font-bold text-lg shadow-lg"></button>
        <p id="err" class="text-red-600 text-sm mt-2"></p>
      </div>
      <div class="border-t pt-6 mt-8">
        <h3 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-3">Description</h3>
        <div id="desc" class="text-gray-600 leading-relaxed text-sm space-y-3"></div>
      </div>
    </div>
  </div>
  <section id="reviews" class="mt-16 max-w-3xl"></section>
</main>

<div id="lb" class="fixed inset-0 z-[100] bg-black/90 items-center justify-center">
  <button id="lbx" class="absolute top-4 right-6 text-white text-4xl">✕</button>
  <button id="lbp" class="absolute left-4 text-white text-5xl px-3">‹</button>
  <img id="lbi" referrerpolicy="no-referrer" class="max-h-[92vh] max-w-[92vw] object-contain">
  <button id="lbn" class="absolute right-4 text-white text-5xl px-3">›</button>
</div>

<script src="site.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let P, imgs = [], cur = 0;

function show(i) {
  cur = (i + imgs.length) % imgs.length;
  $('main').src = imgs[cur]; $('lbi').src = imgs[cur];
  document.querySelectorAll('.thumb').forEach((t, k) => t.classList.toggle('active', k === cur));
}

async function load() {
  const L = $('loading'), id = new URLSearchParams(location.search).get('id');
  if (!id) { L.textContent = 'No product ID.'; return; }
  try {
    const d = await (await fetch(API)).json();
    if (d.error) throw new Error(d.error);
    applyTheme(d.settings);
    P = d.products.find(p => p.id === id);
    if (!P) { L.textContent = 'Product not found.'; return; }
    document.title = P.title + ' | ' + d.settings.site_name;
    $('title').textContent = P.title;
    $('desc').innerHTML = P.description ? sanitize(P.description) : '<p>No description.</p>';

    imgs = P.images.length ? P.images : [PLACEHOLDER];
    $('main').onerror = () => { $('main').onerror = null; $('main').src = PLACEHOLDER; };
    imgs.forEach((u, i) => {
      const t = document.createElement('img');
      t.referrerPolicy = 'no-referrer'; t.src = u;
      t.className = 'thumb w-full aspect-square object-cover rounded-lg bg-white p-1';
      t.onclick = () => show(i); $('thumbs').appendChild(t);
    });
    show(0);
    if (imgs.length < 2) $('thumbs').classList.add('hidden');
    $('main').onclick = () => $('lb').classList.add('open');
    $('lbx').onclick = () => $('lb').classList.remove('open');
    $('lbp').onclick = () => show(cur - 1); $('lbn').onclick = () => show(cur + 1);
    $('lb').onclick = (e) => { if (e.target === $('lb')) $('lb').classList.remove('open'); };
    document.onkeydown = (e) => {
      if (!$('lb').classList.contains('open')) return;
      if (e.key === 'Escape') $('lb').classList.remove('open');
      if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1);
    };

    const revs = d.reviews.filter(r => r.productId === P.id), S = d.settings;
    if (on(S.reviews_on) && P.reviewCount) $('rating').innerHTML = `${stars(P.rating)} <b>${P.rating}</b> <a href="#reviews" class="text-gray-500 underline">(${P.reviewCount} reviews)</a>`;

    $('price').textContent = money(P.price) + ' CAD';
    const pre = P.status === 'upcoming' && P.preorder;
    const canBuy = (P.status === 'live' || pre) && P.qty > 0;
    if (P.status === 'upcoming') $('meta').textContent = 'Coming ' + (P.startsAt ? new Date(P.startsAt).toLocaleDateString() : 'soon') + (pre ? ' - pre-order now' : '');
    if (P.status === 'archived') $('meta').textContent = 'This deal has ended.';
    if (P.status === 'live' && on(S.stock_bar_on)) $('stock').innerHTML = stockBar(P);

    if (!canBuy) {
      $('qtyRow').classList.add('hidden');
      $('buy').disabled = true;
      $('buy').textContent = P.status === 'archived' ? 'Deal ended' : P.status === 'upcoming' ? 'Coming soon' : 'Sold out';
    } else {
      const upd = () => { const q = Number($('qty').value); $('buy').textContent = (pre ? 'Pre-order' : 'Buy now') + ' - ' + money(P.price * q); };
      $('minus').onclick = () => { $('qty').value = Math.max(1, $('qty').value - 1); upd(); };
      $('plus').onclick = () => { $('qty').value = Math.min(P.qty, Number($('qty').value) + 1); upd(); };
      upd();
      $('buy').onclick = async () => {
        $('buy').disabled = true; $('err').textContent = '';
        try { const r = await api({ action: 'checkout', productId: P.id, qty: Number($('qty').value) }); location.href = r.url; }
        catch (e) { $('err').textContent = e.message; $('buy').disabled = false; }
      };
    }

    if (on(S.reviews_on)) {
      $('reviews').innerHTML = `<h2 class="text-2xl font-bold mb-4">Customer reviews</h2>` + (revs.length
        ? revs.map(r => `<div class="border-b py-4"><div>${stars(r.stars)} <b class="ml-1">${esc(r.name)}</b>${r.verified ? ' <span class="text-xs text-green-700 font-semibold ml-1">Verified purchase</span>' : ''}</div>
          <p class="text-sm text-gray-700 mt-1">${esc(r.text)}</p>
          ${r.reply ? `<p class="text-sm bg-gray-50 border-l-4 pl-3 py-2 mt-2"><b>Seller reply:</b> ${esc(r.reply)}</p>` : ''}</div>`).join('')
        : '<p class="text-gray-400 text-sm">No reviews yet.</p>');
    }
    L.classList.add('hidden'); $('content').classList.remove('hidden');
  } catch (e) { L.textContent = 'Failed to load: ' + e.message; }
}
load();
</script>
</body>
</html>
