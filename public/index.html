<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealerama | Today's Hottest Deals</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #f9f9f9; font-family: system-ui, sans-serif; }
  .badge { position: absolute; top: 12px; left: 12px; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: bold; text-transform: uppercase; background: #ef4444; color: white; z-index: 10; }
  .product-card { transition: transform 0.2s; }
  .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
</style>
</head>
<body class="text-gray-800">
<nav class="bg-white shadow-sm p-6 mb-12">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-3xl font-black uppercase tracking-tighter">Dealerama</h1>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-6 pb-24">
  <h2 class="text-4xl font-bold mb-8">Today's Hottest Deals</h2>
  <div id="loading" class="text-center text-gray-400 py-12">Loading deals...</div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="product-grid"></div>
</main>
<script>
async function loadProducts() {
  try {
    const res = await fetch('/.netlify/functions/get-products');
    const data = await res.json();
    document.getElementById('loading').classList.add('hidden');
    
    if (data.products && data.products.length > 0) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = data.products.map(p => {
        let coverImage = (p.images && p.images.length > 0 && p.images[0]) ? p.images[0] : 'https://placehold.co/400x400?text=No+Image';
        
        // Strict Regex to extract Google Drive ID and use the proxy
        if (coverImage.includes('lh3.googleusercontent.com') || coverImage.includes('drive.google.com')) {
           const match = coverImage.match(/id=([a-zA-Z0-9_-]+)/) || coverImage.match(/d\/([a-zA-Z0-9_-]+)/);
           if (match && match[1]) {
             coverImage = `https://wsrv.nl/?url=https://drive.google.com/uc?id=${match[1]}&w=600&output=webp`;
           }
        }

        const plainDesc = p.description ? p.description.replace(/<[^>]*>?/gm, '').substring(0, 80) + '...' : 'No description available.';
        
        return `
        <div class="product-card bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col relative">
          <span class="badge">${p.dealType ? p.dealType.toUpperCase() : 'DEAL'}</span>
          <a href="product.html?id=${p.id}">
            <img src="${coverImage}" class="w-full h-64 object-contain bg-gray-50 p-4">
          </a>
          <div class="p-6 flex flex-col flex-grow">
            <a href="product.html?id=${p.id}"><h4 class="font-bold text-lg mb-2 hover:text-blue-600">${p.title}</h4></a>
            <p class="text-gray-500 text-sm mb-4 flex-grow">${plainDesc}</p>
            <div class="flex justify-between items-center mt-auto">
              <span class="text-2xl font-black text-green-600">$${p.price || '0.00'}</span>
              <a href="product.html?id=${p.id}" class="bg-black hover:bg-gray-800 text-white px-6 py-2 rounded-full text-sm font-bold transition">View Deal</a>
            </div>
          </div>
        </div>`;
      }).join('');
    } else {
      document.getElementById('loading').textContent = 'No deals active right now. Check back soon!';
    }
  } catch (err) { 
    document.getElementById('loading').textContent = 'Error loading products: ' + err.message;
  }
}
loadProducts();
</script>
</body>
</html>
